<!DOCTYPE html>
<html lang="ru" data-theme="dark" data-chrome-theme="cyber-blue">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https: data: browser:; media-src browser:;">
  <title>DEFFI Browser</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <div id="wall" aria-hidden="true">
    <video id="wall-video" muted loop playsinline preload="auto"></video>
    <img id="wall-img" alt="">
    <div id="wall-dim"></div>
  </div>
  <header id="titlebar">
    <div id="tabs-area">
      <!-- Шапка вертикального сайдбара (видна только при data-vtabs="1"): кнопка сворачивания и счётчик вкладок -->
      <div id="vt-head">
        <button id="vt-collapse" type="button" title="Свернуть панель вкладок" aria-label="Свернуть панель вкладок" aria-expanded="true">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9.8 3.6L5.4 8l4.4 4.4"/>
          </svg>
        </button>
        <span id="vt-title">Вкладки</span>
        <span id="vt-count" aria-hidden="true">0</span>
      </div>
      <!-- Переключатель рабочих пространств: в обычной полосе слева от вкладок, в вертикальном сайдбаре под шапкой -->
      <button id="ws-btn" type="button" title="Рабочие пространства" aria-haspopup="dialog" aria-expanded="false" aria-controls="ws-popover" hidden>
        <span id="ws-dot" aria-hidden="true"></span>
        <span id="ws-name"></span>
        <svg class="ws-chev" width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4.5l3 3 3-3"/></svg>
      </button>
      <div id="tabs-strip" role="tablist" aria-label="Открытые вкладки"></div>
      <button id="newtab" title="Новая вкладка (Ctrl+T)" aria-label="Новая вкладка">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
          <path d="M8 3.2v9.6M3.2 8h9.6"/>
        </svg>
      </button>
      <div id="drag-spacer"></div>
    </div>

    <button id="incognito-badge" type="button" title="Выйти из режима Инкогнито" aria-label="Выйти из режима Инкогнито" hidden>
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M2 8.2h12M4 8.2l1-4.4h6l1 4.4"/><circle cx="5" cy="11.4" r="1.7"/><circle cx="11" cy="11.4" r="1.7"/>
      </svg>
      <span>Инкогнито</span>
    </button>

    <div id="window-controls">
      <button class="win-btn" id="win-min" title="Свернуть" aria-label="Свернуть">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2">
          <path d="M2 6h8"/>
        </svg>
      </button>
      <button class="win-btn" id="win-max" title="Развернуть" aria-label="Развернуть">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2">
          <rect x="2.2" y="2.2" width="7.6" height="7.6" rx="1.2"/>
        </svg>
      </button>
      <button class="win-btn win-close" id="win-close" title="Закрыть" aria-label="Закрыть">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
          <path d="M2.6 2.6l6.8 6.8M9.4 2.6l-6.8 6.8"/>
        </svg>
      </button>
    </div>
  </header>

  <div id="toolbar">
    <div class="nav-group">
      <button class="icon-btn" id="btn-vtabs" type="button" title="Вертикальные вкладки" aria-label="Вертикальные вкладки" aria-pressed="false">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2" y="2.6" width="12" height="10.8" rx="2.2"/>
          <path d="M6.1 2.9v10.2"/>
          <path d="M3.7 5.6h.9M3.7 8h.9M3.7 10.4h.9"/>
        </svg>
      </button>
      <button class="icon-btn" id="btn-back" title="Назад (Alt+←)" aria-label="Назад" disabled>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.2 3.4L5.6 8l4.6 4.6"/>
        </svg>
      </button>
      <button class="icon-btn" id="btn-forward" title="Вперёд (Alt+→)" aria-label="Вперёд" disabled>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5.8 3.4L10.4 8l-4.6 4.6"/>
        </svg>
      </button>
      <button class="icon-btn" id="btn-reload" title="Обновить (Ctrl+R)" aria-label="Обновить">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13.2 8a5.2 5.2 0 1 1-1.4-3.5"/>
          <path d="M13.2 3.2v2.9h-2.9"/>
        </svg>
      </button>
    </div>

    <div id="omnibox">
      <button id="site-badge" type="button" aria-label="Сведения о сайте и права" aria-haspopup="dialog" aria-expanded="false" aria-controls="site-popover" disabled></button>
      <input
        id="url"
        type="text"
        autocomplete="off"
        spellcheck="false"
        placeholder="Введите адрес или поисковый запрос"
        aria-label="Адресная строка"
      >
      <button id="zoom-badge" type="button" title="Сбросить масштаб (Ctrl+0)" aria-label="Сбросить масштаб" hidden>100%</button>
      <button id="btn-bookmark" type="button" title="Добавить в закладки (Ctrl+D)" aria-label="Добавить в закладки" aria-pressed="false" hidden>
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
          <path d="M8 1.9l1.84 3.88 4.26.55-3.12 2.94.78 4.22L8 11.35l-3.76 2.04.78-4.22L1.9 6.33l4.26-.55L8 1.9z"/>
        </svg>
      </button>
    </div>

    <div class="actions-group">
      <button class="icon-btn" id="btn-gemini" type="button" title="Спросить Gemini (Alt+G)" aria-label="Спросить Gemini" aria-pressed="false">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <path d="M8 1.5c.35 3.4 3.1 6.15 6.5 6.5-3.4.35-6.15 3.1-6.5 6.5-.35-3.4-3.1-6.15-6.5-6.5 3.4-.35 6.15-3.1 6.5-6.5z"/>
        </svg>
      </button>
      <button class="icon-btn" id="btn-incognito" title="Режим Инкогнито (Ctrl+Shift+N)" aria-label="Режим Инкогнито" aria-pressed="false">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M2 8.2h12M4 8.2l1-4.4h6l1 4.4"/><circle cx="5" cy="11.4" r="1.7"/><circle cx="11" cy="11.4" r="1.7"/>
      </svg>
      </button>
      <button class="icon-btn" id="btn-reopen" title="Восстановить закрытую вкладку (Ctrl+Shift+T)" aria-label="Восстановить закрытую вкладку" disabled>
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3.2 7.2V3.8h3.4"/>
          <path d="M3.5 7A5 5 0 1 1 5 11.8"/>
        </svg>
      </button>
      <button class="icon-btn" id="btn-downloads" title="Загрузки" aria-label="Загрузки">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 2.5v7.2M4.9 6.9L8 10l3.1-3.1M3 13h10"/>
        </svg>
        <span class="dl-progress" aria-hidden="true"></span>
      </button>
      <button class="icon-btn" id="btn-palette" title="Цвет панели (ЛКМ — далее, ПКМ — назад)" aria-label="Сменить цветовую тему панели">
        <span class="palette-orb" aria-hidden="true"></span>
      </button>
      <button class="icon-btn" id="btn-theme" title="Переключить тему" aria-label="Переключить тему"></button>
      <button class="icon-btn" id="btn-menu" title="Меню браузера" aria-label="Меню браузера">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
          <circle cx="8" cy="3.5" r="1.3"/>
          <circle cx="8" cy="8" r="1.3"/>
          <circle cx="8" cy="12.5" r="1.3"/>
        </svg>
      </button>
    </div>

    <div id="chrome-theme-toast" role="status" aria-live="polite">
      <span class="toast-dot"></span>
      <span id="chrome-theme-toast-text">Cyber Blue</span>
    </div>

    <div id="loading-bar" aria-hidden="true"></div>
  </div>

  <!-- Панель закладок (Ctrl+Shift+B): блок в потоке под #toolbar, как #findbar. Высота задаётся main (BM_BAR_HEIGHT → --bmbar-height),
       он же сдвигает страницу вниз. В Инкогнито скрыта -->
  <nav id="bmbar" aria-label="Панель закладок" hidden>
    <div id="bmbar-list" role="toolbar" aria-label="Закладки"></div>
    <span id="bmbar-empty" hidden>Закладки появятся здесь: нажмите ★ в адресной строке</span>
  </nav>

  <!-- Поиск по странице (Ctrl+F). Это обычный блок в потоке под #toolbar, а не оверлей: WebContentsView перекрыл бы любой
       HTML поверх страницы, поэтому main сдвигает страницу вниз на --findbar-height, пока панель открыта -->
  <div id="findbar" role="search" aria-label="Поиск по странице" hidden>
    <div id="find-field">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
        <circle cx="7.2" cy="7.2" r="4.5"/>
        <path d="M10.6 10.6L13.6 13.6"/>
      </svg>
      <input
        id="find-input"
        type="text"
        autocomplete="off"
        spellcheck="false"
        maxlength="500"
        placeholder="Найти на странице"
        aria-label="Текст для поиска на странице"
      >
      <span id="find-count" role="status" aria-live="polite"></span>
    </div>
    <button class="icon-btn" id="find-prev" type="button" title="Предыдущее (Shift+Enter, Shift+F3)" aria-label="Предыдущее совпадение" disabled>
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3.6 10.2L8 5.8l4.4 4.4"/>
      </svg>
    </button>
    <button class="icon-btn" id="find-next" type="button" title="Следующее (Enter, F3)" aria-label="Следующее совпадение" disabled>
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3.6 5.8L8 10.2l4.4-4.4"/>
      </svg>
    </button>
    <button class="icon-btn" id="find-case" type="button" title="Учитывать регистр" aria-label="Учитывать регистр" aria-pressed="false">Aa</button>
    <button class="icon-btn" id="find-close" type="button" title="Закрыть (Esc)" aria-label="Закрыть поиск">
      <svg width="13" height="13" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
        <path d="M2.6 2.6l6.8 6.8M9.4 2.6l-6.8 6.8"/>
      </svg>
    </button>
  </div>

  <!-- Split View: разделитель лежит в 6px-зазоре между двумя WebContentsView, поэтому мышь ловит само окно интерфейса -->
  <div id="gemini-divider" role="separator" aria-orientation="vertical" aria-label="Граница панели Gemini" hidden></div>
  <div id="split-divider" role="separator" aria-orientation="vertical" aria-label="Граница Split View" hidden></div>

  <!-- Выпадающее меню папки с панели закладок: заполняется и позиционируется из ui.js; пока открыто, страницы скрыты (setSitePopoverOpen) -->
  <div id="bm-menu" role="menu" aria-label="Содержимое папки" hidden></div>

  <!-- Поповер звёздочки (клик по ★ / Ctrl+D) -->
  <div id="bm-popover" role="dialog" aria-labelledby="bmp-title" hidden>
    <div id="bmp-title">Закладка добавлена</div>
    <label class="bmp-field">
      <span>Название</span>
      <input id="bmp-name" type="text" maxlength="200" autocomplete="off" spellcheck="false">
    </label>
    <div class="bmp-field">
      <span id="bmp-folder-label">Папка</span>
      <div id="bmp-folders" role="listbox" aria-labelledby="bmp-folder-label"></div>
    </div>
    <div id="bmp-error" role="alert" hidden></div>
    <div class="bmp-actions">
      <button id="bmp-remove" type="button" class="bmp-btn danger">Удалить</button>
      <button id="bmp-done" type="button" class="bmp-btn primary">Готово</button>
    </div>
  </div>

  <!-- Карточка «Сохранить пароль?» (main шлёт password-save:prompt); пока открыта, страницы скрыты через setSitePopoverOpen -->
  <div id="pw-popover" role="dialog" aria-labelledby="pwp-title" aria-describedby="pwp-user" hidden>
    <div id="pwp-title">Сохранить пароль для <span id="pwp-host"></span>?</div>
    <div id="pwp-user"></div>
    <div id="pwp-error" role="alert" hidden></div>
    <div class="bmp-actions">
      <button id="pwp-dismiss" type="button" class="bmp-btn">Не сейчас</button>
      <button id="pwp-save" type="button" class="bmp-btn primary">Сохранить</button>
    </div>
  </div>

  <!-- Поповер рабочих пространств. Содержимое строит ui.js; пока он открыт, страницы скрыты через setSitePopoverOpen -->
  <div id="ws-popover" role="dialog" aria-label="Рабочие пространства" hidden>
    <div class="ws-title">Рабочие пространства</div>
    <ul id="ws-list"></ul>
    <div class="ws-create">
      <input id="ws-new-name" type="text" maxlength="24" placeholder="Новое пространство" autocomplete="off" spellcheck="false">
      <button id="ws-new-btn" type="button">Создать</button>
    </div>
  </div>

  <!-- Карточка безопасности сайта (клик по замочку). Позиционируется из ui.js под адресной строкой.
       Пока она открыта, ui.js сообщает об этом в main через setSitePopoverOpen, чтобы страница не перекрывала карточку -->
  <div id="site-popover" role="dialog" aria-label="Безопасность сайта" aria-describedby="sp-status" hidden>
    <div class="sp-head">
      <span id="sp-icon" aria-hidden="true"></span>
      <div class="sp-titles">
        <div id="sp-host"></div>
        <div id="sp-status"></div>
      </div>
    </div>
    <div id="sp-perms" hidden>
      <div class="sp-section">Разрешения для сайта</div>
      <ul id="sp-list">
        <li>
          <button class="sp-row" type="button" role="switch" aria-checked="false" data-perm="microphone">
            <span class="sp-row-icon" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="1.8" width="4" height="7.4" rx="2"/><path d="M3.6 7.8a4.4 4.4 0 0 0 8.8 0M8 12.2v2"/></svg></span>
            <span class="sp-row-name">Микрофон</span>
            <span class="sp-row-state">Спрашивать</span>
            <span class="sp-switch" aria-hidden="true"></span>
          </button>
        </li>
        <li>
          <button class="sp-row" type="button" role="switch" aria-checked="false" data-perm="camera">
            <span class="sp-row-icon" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1.8" y="4.4" width="8.6" height="7.2" rx="1.6"/><path d="M10.4 7.2l3.8-2v5.6l-3.8-2z"/></svg></span>
            <span class="sp-row-name">Камера</span>
            <span class="sp-row-state">Спрашивать</span>
            <span class="sp-switch" aria-hidden="true"></span>
          </button>
        </li>
        <li>
          <button class="sp-row" type="button" role="switch" aria-checked="false" data-perm="notifications">
            <span class="sp-row-icon" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.2V7.4a4 4 0 0 1 8 0v3.8l1.2 1.4H2.8L4 11.2z"/><path d="M6.6 14h2.8"/></svg></span>
            <span class="sp-row-name">Уведомления</span>
            <span class="sp-row-state">Спрашивать</span>
            <span class="sp-switch" aria-hidden="true"></span>
          </button>
        </li>
        <li>
          <button class="sp-row" type="button" role="switch" aria-checked="false" data-perm="clipboard">
            <span class="sp-row-icon" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3.2" y="3" width="9.6" height="11" rx="1.6"/><path d="M6 3V2.2h4V3M5.8 7.4h4.4M5.8 10.2h4.4"/></svg></span>
            <span class="sp-row-name">Буфер обмена</span>
            <span class="sp-row-state">Спрашивать</span>
            <span class="sp-switch" aria-hidden="true"></span>
          </button>
        </li>
      </ul>
      <button id="sp-reset" type="button" disabled>Сбросить разрешения</button>
    </div>
  </div>

  <!-- Модалка HTTP-авторизации (сайт или прокси). Данные и видимость приходят из main через onAuthPrompt -->
  <div id="auth-modal" hidden>
    <form id="auth-dialog" role="alertdialog" aria-modal="true" aria-labelledby="auth-title" aria-describedby="auth-host" autocomplete="off" novalidate>
      <h2 id="auth-title">Требуется вход</h2>
      <div id="auth-host"></div>
      <div id="auth-realm" hidden></div>
      <div id="auth-warning" role="alert" hidden>
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M8 2.4L14 13H2L8 2.4z"/>
          <path d="M8 6.3v3M8 11.2h.01"/>
        </svg>
        <span>Соединение не защищено</span>
      </div>
      <label class="auth-field">
        <span>Логин</span>
        <input id="auth-username" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="256">
      </label>
      <label class="auth-field">
        <span>Пароль</span>
        <input id="auth-password" type="password" autocomplete="off" spellcheck="false" maxlength="1024">
      </label>
      <div class="auth-actions">
        <button type="button" class="auth-btn" id="auth-cancel">Отмена</button>
        <button type="submit" class="auth-btn auth-btn-primary" id="auth-submit">Войти</button>
      </div>
    </form>
  </div>

  <script src="js/ui.js"></script>
  <script src="js/chromeTheme.js"></script>
</body>
</html>
